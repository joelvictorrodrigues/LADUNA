[build]
  publish = "public"
  functions = "../netlify/functions"

[[redirects]]
  from = "https://sistema.ladunastudio.com.br/*"
  to = "https://ladunadiretoria.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://clientes.ladunastudio.com.br/.netlify/functions/*"
  to = "https://laduna.netlify.app/.netlify/functions/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://clientes.ladunastudio.com.br/assets/*"
  to = "https://laduna.netlify.app/assets/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://clientes.ladunastudio.com.br/portal/*"
  to = "https://laduna.netlify.app/portal/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://clientes.ladunastudio.com.br/*"
  to = "https://laduna.netlify.app/portal/:splat"
  status = 200
  force = true

[[headers]]
  for = "/portal/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://sistema.ladunastudio.com.br https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://*.firebaseio.com https://*.firebasedatabase.app; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
